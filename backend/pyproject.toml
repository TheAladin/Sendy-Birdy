[project]
name = "sendy-birdy"
version = "0.1.0"
description = "Self-hosted app for sending screenshots, demo videos and notes to clients through private, expiring links."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic-settings>=2.16.2",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # import sorting
    "B",     # flake8-bugbear
    "UP",    # pyupgrade
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
    "ASYNC", # blocking calls inside async code
    "S",     # flake8-bandit (security)
    "PT",    # flake8-pytest-style
    "PTH",   # prefer pathlib over os.path
    "FAST",  # FastAPI
    "RUF",   # Ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Asserts and dummy secrets are expected in tests.
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
