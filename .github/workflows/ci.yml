name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sendy
          POSTGRES_PASSWORD: sendy
          POSTGRES_DB: sendy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sendy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Throwaway values for the CI-only database; not secrets.
      SECRET_KEY: ci-secret-key-that-is-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://sendy:sendy@127.0.0.1:5432/sendy_test
      TEST_DATABASE_URL: postgresql+asyncpg://sendy:sendy@127.0.0.1:5432/sendy_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github
      - name: Check formatting
        run: uv run ruff format --check
      - name: Install ffmpeg (for video poster tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # pg_dump refuses a server newer than itself, so the client must be 18 like the service.
      - name: Install PostgreSQL 18 client tools (for backup tests)
        run: |
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
      - name: Create the backup test databases
        env:
          PGPASSWORD: sendy
        run: |
          createdb -h 127.0.0.1 -U sendy sendy_backup_test
          createdb -h 127.0.0.1 -U sendy sendy_restore_test
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check models match migrations
        run: uv run alembic check
      - name: Test
        run: uv run pytest --cov

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  api-types:
    name: API types up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          (cd backend && uv sync --locked)
          (cd frontend && npm ci)
      - name: Regenerate frontend API types
        run: make gen-api
      - name: Fail if they differ from the committed ones
        run: git diff --exit-code frontend/src/api/schema.d.ts || (echo "::error::API types are out of date. Run 'make gen-api' and commit the result." && exit 1)

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and run the whole stack on a clean machine
        run: ./docker/smoke-test.sh
