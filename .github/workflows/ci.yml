name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sendy
          POSTGRES_PASSWORD: sendy
          POSTGRES_DB: sendy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sendy"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      # Throwaway values for the CI-only database; not secrets.
      SECRET_KEY: ci-secret-key-that-is-at-least-32-characters
      DATABASE_URL: postgresql+asyncpg://sendy:sendy@127.0.0.1:5432/sendy_test
      TEST_DATABASE_URL: postgresql+asyncpg://sendy:sendy@127.0.0.1:5432/sendy_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check --output-format=github
      - name: Check formatting
        run: uv run ruff format --check
      - name: Apply migrations
        run: uv run alembic upgrade head
      - name: Check models match migrations
        run: uv run alembic check
      - name: Test
        run: uv run pytest --cov

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Check formatting
        run: npm run format:check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
